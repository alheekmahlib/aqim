name: aqim
description: "A Prayer and qibla application."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.16+23

environment:
  sdk: '>=3.12.2 <4.0.0'

dependencies:
  adhan: ^2.0.0+1
  arabic_justified_text: ^1.0.4
  archive: ^4.2.0
  background_fetch: ^1.7.0
  badges: ^3.2.0
  bot_toast: ^4.1.3
  bubble_lens: ^2.0.0
  compassx: ^1.0.1
  connectivity_kit:
    git:
      url: https://github.com/alheekmahlib/connectivity_kit.git
      ref: v0.2.0
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.9
  dio: ^5.11.1
  drawing_animation:
    git:
      ref: master
      url: https://github.com/alheekmahlib/drawing_animation.git
  either_dart: ^1.0.0
  file_picker: ^8.0.0
  floating_menu_expendable: ^1.1.1
  floatica: ^1.2.1
    # git:
    #   ref: main
    #   url: https://github.com/alheekmahlib/floaty_nav_bar.git
  flutter:
    sdk: flutter
  flutter_app_info: ^3.0.3
  flutter_cache_manager: ^3.4.2
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.3.0
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_native_splash: ^2.4.8
  flutter_rounded_progress_bar: ^0.3.2
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.0
  gap: ^3.0.1
  gauge_indicator: ^0.6.0
  geolocator: ^14.0.2
  get: ^4.7.3
  get_it: ^9.2.1
  get_storage: ^2.1.1
  google_huawei_availability:
    git:
      ref: dev
      url: https://github.com/alheekmahlib/google_huawei_availability.git
  hijri_date: ^1.1.0
  home_widget: ^0.9.4
  huawei_location: ^6.17.0+300
  huawei_site: ^6.5.1+303
  intl: ^0.20.2
  just_audio: ^0.10.6
  latlong2: ^0.10.1
  liquid_glass_plus: ^0.3.2
  lottie: ^3.5.1
  multi_store_review:
    git:
      url: https://github.com/alheekmahlib/multi_store_review.git
      path: multi_store_review
      # v2.2.1: اسم منتج SPM بصيغة kebab-case كي تتطابق مع مانيفيست
      # FlutterGeneratedPluginSwiftPackage في Flutter 3.47+.
      ref: multi_store_review-v2.2.1
  nominatim_geocoding: ^0.0.6
  package_rename: ^1.10.1
  path: ^1.9.1
  path_provider: ^2.1.6
  screenshot: ^3.0.0
  share_plus: ^12.0.2
  slide_countdown: ^2.0.2
  sliding_panel_kit: ^0.4.0
  smooth_page_indicator: ^3.0.0
  solar_icons: ^0.1.0
  square_percent_indicater: ^0.1.0
  timezone: ^0.11.1
  turf: ^0.0.12
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  # لاستيراد واجهة المنصة في اختبار rate_app_helper فقط؛ ref الـ override
  # أعلاه هو الحاكم للمصدر.
  multi_store_review_platform_interface:
    git:
      url: https://github.com/alheekmahlib/multi_store_review.git
      path: multi_store_review_platform_interface
      ref: multi_store_review_platform_interface-v2.2.0

flutter_native_splash:
  color: "#001A23"
  color_dark: "#001A23"
  image: assets/images/aqim_icon_with_stroke.png
  image_dark: assets/images/aqim_icon_with_stroke.png
  # flutter_lints: true
  android_12:
    image: assets/images/aqim_icon_with_stroke.png
    icon_background_color: "#001A23"
    image_dark: assets/images/aqim_icon_with_stroke.png
    icon_background_color_dark: "#001A23"

package_rename_config:
  android:
    app_name: أقم - مكتبة الحكمة
    package_name: com.alheekmah.aqimApp
  ios:
    app_name: أقم - مكتبة الحكمة
    package_name: com.alheekmah.aqimApp
  macos:
    app_name: أقم - مكتبة الحكمة
    package_name: com.alheekmah.aqimApp
  windows:
    app_name: أقم - مكتبة الحكمة
  # flutter_lints: ^5.0.0
flutter_assets:
  # assets_path: assets/lottie/
  assets_path: assets/svg/
  output_path: lib/core/utils/constants/
  # filename: lottie_constants.dart
  filename: svg_constants.dart
  field_prefix: null
  class_name: SvgPath

flutter:

  uses-material-design: true

  assets:
    - assets/svg/
    - assets/svg/qibla/
    - assets/svg/logo/
    - assets/svg/home/
    - assets/svg/prayer/
    - assets/svg/theme/
    - assets/svg/share/
    - assets/svg/ramadan/
    - assets/images/
    - assets/svg/hijri/
    - assets/json/
    - assets/lottie/
    - assets/locales/
  fonts:
    - family: cairo
      fonts:
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 900
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/Cairo-Regular.ttf
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

dependency_overrides:
  # واجهة المنصة في نفس مستودع multi_store_review وغير منشورة على pub.dev.
  multi_store_review_platform_interface:
    git:
      url: https://github.com/alheekmahlib/multi_store_review.git
      path: multi_store_review_platform_interface
      ref: multi_store_review_platform_interface-v2.2.0
  # مؤقتًا: إصلاح منعلال حالة قائمة floatica (1.2.1 محليًا) حتى يُنشر الإصدار
  floatica:
    path: ../floatica
